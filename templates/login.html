<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoSort Solutions | Secure Login</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔐</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0;
            overflow: hidden; 
            background-color: #f3f4f6;
            color: #111827; 
        }
        
        h1, h2, h3, .brand-text { font-family: 'Montserrat', sans-serif; }

        .bg-shape-1 {
            position: absolute; top: -10%; left: -5%; width: 50vw; height: 50vw;
            background: radial-gradient(circle, rgba(200,200,200,0.4) 0%, transparent 70%);
            filter: blur(60px); pointer-events: none; z-index: 0;
        }
        .bg-shape-2 {
            position: absolute; bottom: 10%; right: -5%; width: 60vw; height: 60vw;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, transparent 70%);
            filter: blur(80px); pointer-events: none; z-index: 0;
        }

        #detectionCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.7; 
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            position: relative;
            z-index: 10;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            border-radius: 4px;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-glass {
            background: #ffffff;
            border: 1px solid #d1d5db;
            color: #111827;
            border-radius: 4px; 
            transition: all 0.2s ease;
        }
        .input-glass:focus {
            outline: none;
            border-color: #111827;
            box-shadow: 0 0 0 1px #111827;
        }

        .btn-black {
            background: #111827;
            color: #ffffff;
            border-radius: 4px; 
            transition: all 0.2s ease;
        }
        .btn-black:hover {
            background: #374151;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center">

    <div class="bg-shape-1"></div>
    <div class="bg-shape-2"></div>

    <canvas id="detectionCanvas"></canvas>

    <div class="z-10 px-4">
        <div class="glass-card w-[460px] h-[460px] flex flex-col justify-between p-10">
            
            <div class="text-center">
                <div class="inline-flex items-center justify-center w-12 h-12 bg-gray-100 border border-gray-200 mb-3 rounded-sm">
                    <i data-feather="box" class="w-5 h-5 text-black"></i>
                </div>
                <h1 class="text-2xl font-bold text-black tracking-tight brand-text">EcoSort Solutions</h1>
                <p class="text-gray-500 text-[11px] mt-1 uppercase tracking-wider font-semibold">Secure Login</p>
            </div>

            <!-- ACTION URL ADDED TO FORM FOR NATIVE SUBMIT -->
            <form id="loginForm" action="/index" method="GET" class="space-y-4 my-auto">
                <div>
                    <label class="block text-gray-700 text-xs font-semibold mb-1.5" for="userId">Email Address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-feather="mail" class="w-4 h-4 text-gray-400"></i>
                        </div>
                        <!-- NAME AND AUTOCOMPLETE ADDED FOR EMAIL -->
                        <input type="email" id="userId" name="email" autocomplete="username" class="input-glass w-full pl-10 pr-4 py-2.5 text-sm" placeholder="name@example.com" required>
                    </div>
                </div>

                <div>
                    <label class="block text-gray-700 text-xs font-semibold mb-1.5" for="password">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-feather="lock" class="w-4 h-4 text-gray-400"></i>
                        </div>
                        <!-- NAME AND AUTOCOMPLETE ADDED FOR PASSWORD -->
                        <input type="password" id="password" name="password" autocomplete="current-password" class="input-glass w-full pl-10 pr-4 py-2.5 text-sm" placeholder="••••••••" maxlength="8" pattern="[a-zA-Z0-9]+" title="Only letters and numbers are allowed. Maximum 8 characters." required>
                    </div>
                    <p class="text-[10px] text-gray-400 mt-1">Max 8 letters/numbers. No special characters.</p>
                </div>

                <div class="flex items-center justify-between mt-2 mb-4">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" class="rounded-sm border-gray-300 text-black focus:ring-black w-3.5 h-3.5">
                        <span class="text-[11px] text-gray-600 font-medium">Remember me</span>
                    </label>
                    <a href="#" class="text-[11px] text-gray-500 hover:text-black font-medium transition">Forgot Password?</a>
                </div>

                <button type="submit" id="submitBtn" class="btn-black w-full font-bold py-3 flex items-center justify-center gap-2 uppercase tracking-wider text-xs shadow-sm mt-2">
                    Sign In <i data-feather="arrow-right" class="w-3 h-3"></i>
                </button>
            </form>
            
            <div class="text-center border-t border-gray-200 pt-4">
                <p class="text-[10px] text-gray-500 font-medium">Secure connection established.</p>
                <div class="flex items-center justify-center gap-1.5 mt-1.5 text-[9px] text-green-600 font-semibold uppercase tracking-wider">
                    <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span> System Monitoring Active
                </div>
            </div>

        </div>
    </div>

    <script>
        feather.replace();

        // Restrict special characters in password field dynamically
        document.getElementById('password').addEventListener('input', function() {
            this.value = this.value.replace(/[^a-zA-Z0-9]/g, '');
        });

        // Login Submit Logic
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            // event.preventDefault() is REMOVED so the browser can natively submit the form 
            // and trigger the "Save Password" popup.
            
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = 'Signing In... <i data-feather="loader" class="w-3 h-3 animate-spin"></i>';
            feather.replace(); 
            
            // The redirection to '/' will happen automatically via the form's 'action' attribute.
        });

        // --- CANVAS ANIMATION ---
        const canvas = document.getElementById('detectionCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let objects = [];

        const wasteClasses = [
            { label: 'Wet Waste', color: '#10b981', items: ['🍎', '🍊', '🍉', '🍇', '🍓', '🍒', '🍑'] }, 
            { label: 'Dry Waste', color: '#3b82f6', items: ['🍼', '🥫', '📦', '🥤', '🗞️', '🛍️'] },
            { label: 'E-Waste', color: '#f59e0b', items: ['💻', '📱', '🔋', '🖱️', '📺', '🖨️'] },
            { label: 'Hazardous Waste', color: '#ef4444', items: ['💊', '🌡️', '🧪', '🩹', '🧴'] }
        ];

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createObject() {
            const category = wasteClasses[Math.floor(Math.random() * wasteClasses.length)];
            const randomIcon = category.items[Math.floor(Math.random() * category.items.length)];
            const size = Math.random() * 60 + 60; 
            
            objects.push({
                x: Math.random() < 0.5 ? -size : width + size, 
                y: Math.random() * (height - 150) + 50, 
                width: size + (Math.random() * 20),
                height: size,
                speedX: (Math.random() * 1.5 + 0.5) * (Math.random() < 0.5 ? 1 : -1), 
                speedY: (Math.random() - 0.5) * 1,
                name: category.label, 
                icon: randomIcon, 
                conf: (Math.random() * 0.15 + 0.80).toFixed(2), 
                color: category.color,
                opacity: 0
            });
        }

        function drawBoundingBox(obj) {
            ctx.save();
            if (obj.opacity < 1) obj.opacity += 0.02;
            ctx.globalAlpha = obj.opacity;

            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.fillRect(obj.x, obj.y, obj.width, obj.height);

            ctx.font = `${obj.height * 0.6}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(obj.icon, obj.x + obj.width / 2, obj.y + obj.height / 2);

            ctx.strokeStyle = obj.color;
            ctx.lineWidth = 2;
            ctx.strokeRect(obj.x, obj.y, obj.width, obj.height);

            const cornerSize = 10;
            ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(obj.x, obj.y + cornerSize); ctx.lineTo(obj.x, obj.y); ctx.lineTo(obj.x + cornerSize, obj.y); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(obj.x + obj.width - cornerSize, obj.y); ctx.lineTo(obj.x + obj.width, obj.y); ctx.lineTo(obj.x + obj.width, obj.y + cornerSize); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(obj.x, obj.y + obj.height - cornerSize); ctx.lineTo(obj.x, obj.y + obj.height); ctx.lineTo(obj.x + cornerSize, obj.y + obj.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(obj.x + obj.width - cornerSize, obj.y + obj.height); ctx.lineTo(obj.x + obj.width, obj.y + obj.height); ctx.lineTo(obj.x + obj.width, obj.y + obj.height - cornerSize); ctx.stroke();

            const labelText = `${obj.name} ${obj.conf}`;
            ctx.fillStyle = obj.color;
            ctx.font = 'bold 11px Inter';
            const textWidth = ctx.measureText(labelText).width;
            
            ctx.fillRect(obj.x, obj.y - 20, textWidth + 10, 20);

            ctx.fillStyle = '#ffffff';
            ctx.fillText(labelText, obj.x + (textWidth + 10)/2, obj.y - 10);
            
            ctx.restore();
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            if (objects.length < 7 && Math.random() < 0.015) {
                createObject();
            }

            for (let i = objects.length - 1; i >= 0; i--) {
                let obj = objects[i];
                
                obj.x += obj.speedX;
                obj.y += obj.speedY;

                drawBoundingBox(obj);

                if (obj.x < -200 || obj.x > width + 200 || obj.y < -200 || obj.y > height + 200) {
                    objects.splice(i, 1);
                }
            }
            requestAnimationFrame(animate);
        }

        for(let i=0; i<4; i++) createObject();
        animate();

    </script>
</body>
</html>
