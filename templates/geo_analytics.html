<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoSort Solutions | Regional Waste Mapping</title>
     <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📍</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Light gray background */
            color: #111827; /* Dark text */
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        h1, h2, h3, h4, h5, .brand-text { font-family: 'Montserrat', sans-serif; }

        /* Abstract Background Elements for Glass effect */
        .bg-shape-1 {
            position: fixed; top: -10%; left: -5%; width: 50vw; height: 50vw;
            background: radial-gradient(circle, rgba(200,200,200,0.5) 0%, transparent 70%);
            filter: blur(60px); pointer-events: none; z-index: -1;
        }
        .bg-shape-2 {
            position: fixed; bottom: -10%; right: -5%; width: 60vw; height: 60vw;
            background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, transparent 70%);
            filter: blur(80px); pointer-events: none; z-index: -1;
        }

        /* Standard Glassmorphism CSS */
        .glass-panel {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border-radius: 24px;
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(229, 231, 235, 0.5);
        }

        /* Map Container */
        #cityHeatmap {
            height: 650px;
            width: 100%;
            border-radius: 16px;
            z-index: 1;
            background-color: #e5e7eb; /* Light fallback */
        }

        /* Leaflet custom styling for Light Theme */
        .leaflet-control-zoom a {
            background-color: rgba(255, 255, 255, 0.9) !important;
            color: #111827 !important;
            border: 1px solid rgba(0, 0, 0, 0.1) !important;
        }
        .leaflet-control-zoom a:hover { background-color: #f3f4f6 !important; }
        
        .leaflet-popup-content-wrapper {
            background: rgba(255, 255, 255, 0.95) !important;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.1) !important;
            color: #111827 !important;
            border-radius: 16px !important;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1) !important;
            padding: 0;
        }
        .leaflet-popup-content { margin: 0; width: 220px !important; }
        .leaflet-popup-tip {
            background: rgba(255, 255, 255, 0.95) !important;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1) !important;
            border-right: 1px solid rgba(0, 0, 0, 0.1) !important;
        }
        
        /* Custom Marker Icon Styling */
        .custom-marker-icon { background: transparent; border: none; overflow: visible; }
        .marker-container { display: flex; flex-direction: column; align-items: center; transform: translate(-50%, -15px); }
        .marker-pulse { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; z-index: 10; }
        .marker-pulse::after { content: ''; position: absolute; width: 100%; height: 100%; border-radius: 50%; animation: pulseRing 1.5s infinite; z-index: -1; }
        
        /* Categories */
        .marker-pulse.critical { background: rgba(239, 68, 68, 0.9); border: 2px solid white; box-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }
        .marker-pulse.critical::after { border: 2px solid #ef4444; }
        .marker-pulse.high { background: rgba(249, 115, 22, 0.9); border: 2px solid white; box-shadow: 0 0 10px rgba(249, 115, 22, 0.5); }
        .marker-pulse.high::after { border: 2px solid #f97316; }
        .marker-pulse.mod { background: rgba(16, 185, 129, 0.9); border: 2px solid white; box-shadow: 0 0 10px rgba(16, 185, 129, 0.5); }
        .marker-pulse.mod::after { border: 2px solid #10b981; }
        .marker-pulse.low { background: rgba(6, 182, 212, 0.9); border: 2px solid white; box-shadow: 0 0 10px rgba(6, 182, 212, 0.5); }
        .marker-pulse.low::after { border: 2px solid #06b6d4; }
        .marker-pulse i { color: white; width: 14px; height: 14px; }
        
        @keyframes pulseRing { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }
        
        /* Scrollbar */
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.2); border-radius: 10px; }
    </style>
</head>
<body class="relative pb-10">

    <div class="bg-shape-1"></div>
    <div class="bg-shape-2"></div>

    <nav class="glass-nav sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="brand-text text-xl font-bold text-black flex items-center gap-2 tracking-tight">
                <i data-feather="box" class="text-black w-5 h-5"></i> EcoSort Solutions
            </h1>
            
            <div class="flex items-center gap-4">
                <label class="text-xs font-semibold tracking-wider text-gray-500 uppercase hidden md:block">Select Location:</label>
                <select id="citySelector" class="bg-white border border-gray-300 text-black font-semibold uppercase tracking-wider text-xs px-4 py-2 rounded-lg outline-none focus:ring-2 focus:ring-gray-200 transition cursor-pointer shadow-sm">
                    <option value="chennai">Chennai Region</option>
                    <option value="madurai">Madurai Region</option>
                    <option value="coimbatore">Coimbatore Region</option>
                    <option value="tvm">Tiruvannamalai Region</option>
                </select>
                <a href="/dashboard" class="ml-2 text-gray-500 hover:text-black transition flex items-center gap-2 text-xs font-semibold tracking-wider uppercase">
                    <i data-feather="grid" class="w-4 h-4"></i> Dashboard
                </a>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 md:px-6 py-8 relative z-10">
        
        <div class="mb-8 flex justify-between items-end">
            <div>
                <h2 id="pageTitle" class="text-3xl font-bold text-black tracking-tight uppercase brand-text">Chennai Region</h2>
                <p class="text-gray-600 text-sm font-medium mt-2">Interactive map displaying waste accumulation data across various areas.</p>
            </div>
            <div class="hidden md:flex items-center gap-2 bg-white border border-gray-200 px-4 py-2 rounded-lg text-black text-xs font-bold tracking-wider uppercase shadow-sm">
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> Live Feed Active
            </div>
        </div>

        <div class="flex flex-col lg:flex-row gap-8">
            
            <div class="w-full lg:w-1/3 flex flex-col gap-6 h-[650px]">
                
                <div class="glass-panel p-6 flex flex-col h-full border border-gray-200">
                    <h3 class="text-black brand-text font-bold text-sm uppercase mb-4 border-b border-gray-200 pb-3 flex items-center justify-between">
                        <span class="flex items-center gap-2"><i data-feather="map-pin" class="w-4 h-4"></i> Area Overview</span>
                        <span class="text-[10px] text-gray-500 font-medium">SORT BY VOLUME</span>
                    </h3>
                    
                    <div class="mb-4 relative">
                        <i data-feather="search" class="w-4 h-4 absolute left-3 top-3 text-gray-400"></i>
                        <input type="text" id="zoneSearch" placeholder="Search areas..." class="w-full bg-white border border-gray-300 text-sm text-black rounded-lg pl-9 pr-3 py-2.5 outline-none focus:border-black transition shadow-sm">
                    </div>

                    <div class="overflow-y-auto pr-2 custom-scroll space-y-3 flex-1" id="hotspotList">
                        </div>
                </div>

            </div>

            <div class="w-full lg:w-2/3 glass-panel p-2 relative overflow-hidden flex flex-col border border-gray-200">
                
                <div class="absolute top-6 left-6 z-[400] pointer-events-none">
                    <div class="bg-white/90 backdrop-blur-md border border-gray-200 p-3 rounded-xl shadow-md">
                        <h3 class="text-black font-bold brand-text text-sm tracking-wider flex items-center gap-2" id="currentZoneLabel">
                            REGION OVERVIEW
                        </h3>
                        <p class="text-gray-500 text-[11px] font-medium uppercase tracking-wider mt-1" id="currentZoneStats">
                            Total Tracked Areas: 0
                        </p>
                    </div>
                </div>

                <div id="cityHeatmap"></div>

                <div class="absolute bottom-6 left-6 z-[400] pointer-events-none">
                    <div class="bg-white/90 backdrop-blur-md border border-gray-200 p-3.5 rounded-xl shadow-md flex flex-col gap-2.5">
                        <div class="flex items-center gap-2 text-xs font-semibold text-gray-700">
                            <span class="w-3 h-3 rounded bg-[#ef4444]"></span> High Volume (>80%)
                        </div>
                        <div class="flex items-center gap-2 text-xs font-semibold text-gray-700">
                            <span class="w-3 h-3 rounded bg-[#f97316]"></span> Medium-High (60-80%)
                        </div>
                        <div class="flex items-center gap-2 text-xs font-semibold text-gray-700">
                            <span class="w-3 h-3 rounded bg-[#10b981]"></span> Medium (40-60%)
                        </div>
                        <div class="flex items-center gap-2 text-xs font-semibold text-gray-700">
                            <span class="w-3 h-3 rounded bg-[#06b6d4]"></span> Low (<40%)
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        // --- DATA FOR MULTIPLE CITIES ---

        const CITY_CONFIG = {
            chennai: { center: [13.06, 80.23], zoom: 11, title: "Chennai Region" },
            madurai: { center: [9.925, 78.119], zoom: 12, title: "Madurai Region" },
            coimbatore: { center: [11.016, 76.955], zoom: 12, title: "Coimbatore Region" },
            tvm: { center: [12.225, 79.065], zoom: 13, title: "Tiruvannamalai Region" }
        };

        const DATA_DB = {
            chennai: [
                { id: "CHN-01", name: "T.Nagar", lat: 13.0405, lng: 80.2337, intensity: 0.95, type: "Commercial", primary: "Packaging Material", desc: "High volume of commercial packaging.", icon: "shopping-bag", color: "#ef4444", cssClass: "critical" },
                { id: "CHN-02", name: "Koyambedu", lat: 13.0673, lng: 80.1923, intensity: 0.85, type: "Market", primary: "Organic Waste", desc: "Large quantities of food materials.", icon: "leaf", color: "#ef4444", cssClass: "critical" },
                { id: "CHN-03", name: "Perungudi", lat: 12.9654, lng: 80.2461, intensity: 0.90, type: "Corporate / Zone", primary: "Electronic / Mixed", desc: "Hardware and office materials.", icon: "monitor", color: "#ef4444", cssClass: "critical" },
                { id: "CHN-04", name: "Adyar", lat: 13.0012, lng: 80.2565, intensity: 0.70, type: "Residential", primary: "Standard Mix", desc: "Regular household clearing.", icon: "home", color: "#f97316", cssClass: "high" },
                { id: "CHN-05", name: "Thiruvottiyur", lat: 13.1610, lng: 80.3015, intensity: 0.65, type: "Industrial", primary: "Scrap & Metal", desc: "Industrial output materials.", icon: "package", color: "#f97316", cssClass: "high" },
                { id: "CHN-06", name: "Valasaravakkam", lat: 13.0396, lng: 80.1802, intensity: 0.35, type: "Residential", primary: "Standard Mix", desc: "Low volume domestic area.", icon: "home", color: "#06b6d4", cssClass: "low" }
            ],
            madurai: [
                { id: "MDU-01", name: "Meenakshi Temple", lat: 9.9195, lng: 78.1193, intensity: 0.90, type: "Public Site", primary: "Organic (Flowers)", desc: "High volume of organic materials.", icon: "sun", color: "#ef4444", cssClass: "critical" },
                { id: "MDU-02", name: "Mattuthavani", lat: 9.9416, lng: 78.1566, intensity: 0.85, type: "Transit Station", primary: "Plastics", desc: "Transit related wrappers.", icon: "map", color: "#ef4444", cssClass: "critical" },
                { id: "MDU-03", name: "Simmakkal Market", lat: 9.9268, lng: 78.1215, intensity: 0.78, type: "Market", primary: "Organic Waste", desc: "Vegetable and fruit output.", icon: "leaf", color: "#f97316", cssClass: "high" },
                { id: "MDU-04", name: "Anna Nagar", lat: 9.9180, lng: 78.1460, intensity: 0.50, type: "Residential", primary: "Standard Mix", desc: "Standard household clearing.", icon: "home", color: "#10b981", cssClass: "mod" },
                { id: "MDU-05", name: "Tallakulam", lat: 9.9320, lng: 78.1360, intensity: 0.65, type: "Commercial", primary: "Cardboard", desc: "Retail shop materials.", icon: "box", color: "#f97316", cssClass: "high" }
            ],
            coimbatore: [
                { id: "CBE-01", name: "Gandhipuram", lat: 11.0175, lng: 76.9660, intensity: 0.92, type: "Commercial", primary: "Packaging", desc: "Core commercial output.", icon: "shopping-bag", color: "#ef4444", cssClass: "critical" },
                { id: "CBE-02", name: "Ukkadam Market", lat: 10.9880, lng: 76.9600, intensity: 0.88, type: "Market", primary: "Organic Waste", desc: "Intense organic/vegetable output.", icon: "leaf", color: "#ef4444", cssClass: "critical" },
                { id: "CBE-03", name: "Peelamedu", lat: 11.0280, lng: 77.0000, intensity: 0.75, type: "Educational", primary: "Paper & Mixed", desc: "Institutional materials.", icon: "book", color: "#f97316", cssClass: "high" },
                { id: "CBE-04", name: "RS Puram", lat: 11.0080, lng: 76.9480, intensity: 0.60, type: "Residential", primary: "Standard Mix", desc: "Controlled domestic output.", icon: "home", color: "#10b981", cssClass: "mod" },
                { id: "CBE-05", name: "Singanallur", lat: 10.9920, lng: 77.0250, intensity: 0.80, type: "Transit", primary: "Scrap Material", desc: "Industrial transit materials.", icon: "truck", color: "#f97316", cssClass: "high" }
            ],
            tvm: [
                { id: "TVM-01", name: "Main Temple Area", lat: 12.2251, lng: 79.0677, intensity: 0.95, type: "Public Site", primary: "Organic", desc: "High volume from visitors.", icon: "sun", color: "#ef4444", cssClass: "critical" },
                { id: "TVM-02", name: "Girivalam Path", lat: 12.2350, lng: 79.0550, intensity: 0.85, type: "Tourist Route", primary: "Plastics", desc: "High density of plastic bottles.", icon: "trash-2", color: "#ef4444", cssClass: "critical" },
                { id: "TVM-03", name: "Central Bus Stand", lat: 12.2312, lng: 79.0715, intensity: 0.78, type: "Transit", primary: "Standard Mix", desc: "Constant influx of transit materials.", icon: "map", color: "#f97316", cssClass: "high" },
                { id: "TVM-04", name: "Ashram Area", lat: 12.2155, lng: 79.0585, intensity: 0.55, type: "Residential", primary: "Organic", desc: "Controlled, moderate volume.", icon: "home", color: "#10b981", cssClass: "mod" },
                { id: "TVM-05", name: "Vengikkal", lat: 12.2450, lng: 79.0700, intensity: 0.45, type: "Residential", primary: "Standard Mix", desc: "Standard household clearing.", icon: "home", color: "#10b981", cssClass: "mod" }
            ]
        };

        let map;
        let heatLayer;
        let markers = [];
        let currentCity = 'chennai';

        document.addEventListener("DOMContentLoaded", () => {
            feather.replace();
            initMap();
            loadCity(currentCity);

            // City Selector Listener
            document.getElementById('citySelector').addEventListener('change', (e) => {
                currentCity = e.target.value;
                loadCity(currentCity);
            });

            // Search Functionality
            document.getElementById('zoneSearch').addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const filtered = DATA_DB[currentCity].filter(z => 
                    z.name.toLowerCase().includes(term) || z.id.toLowerCase().includes(term)
                );
                populateZoneList(filtered);
            });
        });

        // --- 1. SETUP LEAFLET MAP ---
        function initMap() {
            map = L.map('cityHeatmap', { zoomControl: false }).setView(CITY_CONFIG.chennai.center, CITY_CONFIG.chennai.zoom);
            L.control.zoom({ position: 'topright' }).addTo(map);
            
            // Changed to clean Light Theme map
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
        }

        // --- 2. LOAD SPECIFIC CITY DATA ---
        function loadCity(cityKey) {
            const config = CITY_CONFIG[cityKey];
            const data = DATA_DB[cityKey];

            // Update Titles
            document.getElementById('pageTitle').innerText = config.title;
            document.getElementById('currentZoneLabel').innerHTML = `REGION OVERVIEW`;
            document.getElementById('currentZoneStats').innerText = `Total Tracked Areas: ${data.length}`;
            document.getElementById('zoneSearch').value = ''; // Reset search

            // Clear previous map layers
            if (heatLayer) map.removeLayer(heatLayer);
            markers.forEach(m => map.removeLayer(m.marker));
            markers = [];

            // Fly to new city center
            map.flyTo(config.center, config.zoom, { duration: 1.5 });

            let heatPoints = [];

            // Add Markers and build heat points
            setTimeout(() => {
                data.forEach(site => {
                    let spread = cityKey === 'tvm' ? 0.008 : 0.02; 
                    let numPoints = Math.floor(site.intensity * (cityKey === 'tvm' ? 200 : 400)); 
                    
                    heatPoints.push([site.lat, site.lng, site.intensity]); // Core

                    for (let i = 0; i < numPoints; i++) {
                        let latOffset = (Math.random() + Math.random() - 1) * spread;
                        let lngOffset = (Math.random() + Math.random() - 1) * spread;
                        let pointIntensity = site.intensity * (1 - (Math.abs(latOffset) + Math.abs(lngOffset)) / (spread * 2));
                        pointIntensity = pointIntensity * (0.6 + Math.random() * 0.4);
                        heatPoints.push([site.lat + latOffset, site.lng + lngOffset, pointIntensity]);
                    }

                    // Create Custom Marker Icon WITH NAME LABEL
                    const customIcon = L.divIcon({
                        className: 'custom-marker-icon',
                        html: `
                            <div class="marker-container">
                                <div class="marker-pulse ${site.cssClass}"><i data-feather="${site.icon}"></i></div>
                                <div class="mt-1 px-2.5 py-1 bg-white border border-gray-200 rounded text-[10px] font-bold whitespace-nowrap shadow-sm text-gray-800">
                                    ${site.name} <span style="color: ${site.color}; margin-left: 4px;">${(site.intensity * 100).toFixed(0)}%</span>
                                </div>
                            </div>
                        `,
                        iconSize: [0, 0], 
                        iconAnchor: [0, 0]
                    });

                    let marker = L.marker([site.lat, site.lng], { icon: customIcon }).addTo(map);
                    
                    // Clean Light Theme Popup Content
                    let popupContent = `
                        <div class="w-full">
                            <div class="bg-[${site.color}] p-3 rounded-t-[14px] text-center">
                                <h4 class="brand-text font-bold tracking-wider text-[13px] text-white uppercase m-0 leading-tight">${site.id}: ${site.name}</h4>
                            </div>
                            <div class="p-4 bg-white rounded-b-[14px]">
                                <div class="flex justify-between items-center mb-3 border-b border-gray-100 pb-2">
                                    <span class="text-[10px] font-semibold text-gray-500 uppercase tracking-wider">Area Type</span>
                                    <span class="text-[11px] font-bold text-black">${site.type}</span>
                                </div>
                                <div class="flex justify-between items-center mb-3 border-b border-gray-100 pb-2">
                                    <span class="text-[10px] font-semibold text-gray-500 uppercase tracking-wider">Primary Output</span>
                                    <span class="text-[11px] font-bold text-[${site.color}]">${site.primary}</span>
                                </div>
                                <div class="flex justify-between items-center mb-3 border-b border-gray-100 pb-2">
                                    <span class="text-[10px] font-semibold text-gray-500 uppercase tracking-wider">Volume Level</span>
                                    <span class="text-[13px] font-bold brand-text text-[${site.color}]">${(site.intensity * 100).toFixed(0)}%</span>
                                </div>
                                <p class="text-[11px] text-gray-600 leading-snug m-0 text-center font-medium">${site.desc}</p>
                            </div>
                        </div>
                    `;
                    marker.bindPopup(popupContent);
                    marker.on('click', () => updateHUD(site));
                    markers.push({ id: site.id, marker: marker });
                });

                // Add Heat Layer
                heatLayer = L.heatLayer(heatPoints, {
                    radius: 25,
                    blur: 20,
                    maxZoom: 14,
                    max: 1.0, 
                    gradient: { 0.4: '#06b6d4', 0.6: '#10b981', 0.8: '#f97316', 1.0: '#ef4444' }
                }).addTo(map);

                feather.replace();
                populateZoneList(data);
            }, 800);
        }

        // --- 3. POPULATE LEFT LIST ---
        function populateZoneList(data) {
            const listContainer = document.getElementById('hotspotList');
            listContainer.innerHTML = '';

            if(data.length === 0) {
                listContainer.innerHTML = `<div class="text-center text-gray-400 text-sm p-4 font-medium">No areas found.</div>`;
                return;
            }

            const sortedData = [...data].sort((a, b) => b.intensity - a.intensity);

            sortedData.forEach((site) => {
                let itemHTML = `
                    <div class="bg-white border border-gray-200 p-3.5 rounded-xl hover:shadow-md transition-all cursor-pointer group" onclick="focusZone('${site.id}')">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <span class="text-[10px] text-gray-400 font-bold tracking-widest">${site.id}</span>
                                <h4 class="text-black font-bold text-sm tracking-wide flex items-center gap-2 mt-0.5 group-hover:text-[${site.color}] transition">
                                    ${site.name}
                                </h4>
                            </div>
                            <span class="text-[10px] font-bold tracking-wider text-[${site.color}] bg-gray-50 px-2 py-1 rounded border border-gray-200">
                                ${(site.intensity * 100).toFixed(0)}%
                            </span>
                        </div>
                        <div class="flex justify-between items-center border-t border-gray-100 pt-2.5 mt-1.5">
                            <span class="text-[11px] font-semibold text-gray-600 flex items-center gap-1.5">
                                <i data-feather="${site.icon}" class="w-3.5 h-3.5 text-[${site.color}]"></i> ${site.primary}
                            </span>
                            <span class="text-[10px] text-black font-semibold opacity-0 group-hover:opacity-100 transition flex items-center gap-1">Locate <i data-feather="arrow-right" class="w-3 h-3"></i></span>
                        </div>
                    </div>
                `;
                listContainer.insertAdjacentHTML('beforeend', itemHTML);
            });
            feather.replace();
        }

        // --- 4. FOCUS MAP ON LIST CLICK ---
        function focusZone(id) {
            const site = DATA_DB[currentCity].find(z => z.id === id);
            const markerObj = markers.find(m => m.id === id);
            
            if(site && markerObj) {
                let targetZoom = currentCity === 'tvm' ? 16 : 14;
                map.flyTo([site.lat, site.lng], targetZoom, { duration: 1.5 });
                updateHUD(site);
                setTimeout(() => { markerObj.marker.openPopup(); }, 1500);
            }
        }

        // --- 5. UPDATE HUD LABELS ---
        function updateHUD(site) {
            const locLabel = document.getElementById('currentZoneLabel');
            const statsLabel = document.getElementById('currentZoneStats');
            
            locLabel.innerHTML = `${site.id}: ${site.name}`;
            locLabel.className = `text-[${site.color}] brand-text font-bold text-sm tracking-wider flex items-center gap-2`;
            statsLabel.innerText = `OUTPUT: ${site.primary} | VOLUME: ${(site.intensity*100).toFixed(0)}%`;
        }
    </script>
</body>
</html>
